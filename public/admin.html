    <style>
      :root {
        --bg: #ffffff;
        --panel: #fafafa;
        --ink: #0a0a0a;
        --ink-2: #525252;
        --ink-3: #a3a3a3;
        --line: #e5e5e5;
        --line-2: #d4d4d4;
        --primary: #171717;
        --primary-h: #000;
        --danger: #b42318;
        --danger-bg: #fef3f2;
        --ok: #067647;
        --ok-bg: #ecfdf3;
        --radius: 8px;
        --radius-lg: 14px;
        --shadow: 0 1px 2px rgba(10, 10, 10, 0.04), 0 8px 24px rgba(10, 10, 10, 0.05);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }

      /* Top bar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(180%) blur(10px);
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand .logo {
        height: 20px;
        width: auto;
        color: var(--ink);
        display: block;
      }
      .brand .sep {
        width: 1px;
        height: 16px;
        background: var(--line-2);
      }
      .brand .product {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .brand .tag {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 7px;
      }
      .userbox {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .userbox .who {
        max-width: 40vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .logout {
        font-family: inherit;
        font-size: 13px;
        color: var(--ink-2);
        background: none;
        border: 1px solid var(--line-2);
        border-radius: var(--radius);
        padding: 6px 12px;
        cursor: pointer;
      }
      .logout:hover {
        background: var(--panel);
        color: var(--ink);
      }

      /* Layout */
      .wrap {
        max-width: 940px;
        margin: 0 auto;
        padding: 34px 22px 60px;
      }
      .head {
        margin-bottom: 24px;
      }
      .head h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }
      .head p {
        margin: 0;
        color: var(--ink-3);
        font-size: 14px;
      }

      .card {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
        margin-bottom: 22px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      .card-head .count {
        font-size: 12.5px;
        color: var(--ink-3);
      }

      /* Add form */
      .addform {
        display: grid;
        grid-template-columns: 1.4fr 1fr 130px auto;
        gap: 10px;
        padding: 16px 20px;
      }
      .addform input,
      .addform select {
        width: 100%;
        font-family: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--radius);
        padding: 9px 12px;
      }
      .addform input:focus,
      .addform select:focus {
        outline: none;
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.06);
      }

      .btn {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        font-weight: 500;
        border-radius: var(--radius);
        padding: 9px 16px;
        cursor: pointer;
        border: 1px solid transparent;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-h);
      }
      .btn-primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn-sm {
        font-size: 12.5px;
        padding: 5px 10px;
      }
      .btn-ghost {
        background: var(--bg);
        color: var(--ink-2);
        border-color: var(--line-2);
      }
      .btn-ghost:hover {
        background: var(--panel);
        color: var(--ink);
      }
      .btn-danger {
        background: var(--bg);
        color: var(--danger);
        border-color: #fecdca;
      }
      .btn-danger:hover {
        background: var(--danger-bg);
      }

      /* Table */
      .table-scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      thead th {
        text-align: left;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-3);
        padding: 11px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        white-space: nowrap;
      }
      tbody td {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #fcfcfc;
      }
      .email {
        font-weight: 500;
        color: var(--ink);
      }
      .email .you {
        font-size: 11px;
        color: var(--ink-3);
        margin-left: 6px;
      }
      td select.role {
        font-family: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 20px;
        padding: 3px 10px;
        border: 1px solid var(--line);
      }
      .badge.on {
        color: var(--ok);
        background: var(--ok-bg);
        border-color: #abefc6;
      }
      .badge.off {
        color: var(--ink-3);
        background: var(--panel);
      }
      .badge .dotb {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .muted {
        color: var(--ink-3);
        font-size: 12.5px;
      }

      /* States */
      .state {
        padding: 40px 20px;
        text-align: center;
        color: var(--ink-3);
        font-size: 14px;
      }

      /* Toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: #fff;
        font-size: 13.5px;
        padding: 11px 18px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 50;
        max-width: 90vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.err {
        background: var(--danger);
      }

      @media (max-width: 720px) {
        .addform {
          grid-template-columns: 1fr 1fr;
        }
        .addform .btn {
          grid-column: 1 / -1;
        }
        .brand .product {
          display: none;
        }
      }
    </style>
  </head>

        <span class="sep"></span>
        <span class="product">ego signals</span>
        <span class="tag">admin</span>
      </div>
      <div class="userbox">
        <span class="who" id="whoami">—</span>
        <button class="logout" id="logoutBtn">sair</button>
      </div>
    </div>

    <div class="wrap">
      <div class="head">
        <h1>Usuários</h1>
        <p>Gerencie quem acessa o ego signals e o papel de cada um.</p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Adicionar usuário</h2>
        </div>
        <form class="addform" id="addForm">
          <input type="email" id="newEmail" placeholder="e-mail" autocomplete="off" required />
          <input type="password" id="newPass" placeholder="senha (mín. 6)" autocomplete="new-password" required />
          <select id="newRole">
            <option value="user">user</option>
            <option value="admin">admin</option>
            <option value="guest">guest</option>
          </select>
          <button type="submit" class="btn btn-primary" id="addBtn">Adicionar</button>
        </form>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Todos os usuários</h2>
          <span class="count" id="count"></span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>E-mail</th>
                <th>Papel</th>
                <th>Status</th>
                <th>Criado</th>
                <th style="text-align: right">Ações</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr>
                <td colspan="5">
                  <div class="state" id="loadingState">Carregando…</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const cfg = window.IH_CONFIG || {};
      const $ = (id) => document.getElementById(id);

      // ---- Auth / gate ----
      function getAuth() {
        try {
          return JSON.parse(localStorage.getItem('ego_auth') || 'null');
        } catch {
          return null;
        }
      }
      const auth = getAuth();
      const expired = auth && auth.exp && Date.now() / 1000 > auth.exp;
      if (!auth || !auth.token || expired || auth.role !== 'admin') {
        try {
          localStorage.removeItem('ego_auth');
        } catch {}
        location.replace('login.html');
      }

      function apiBase() {
        const isDevLocal =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (cfg.wsUrl && !isDevLocal) {
          return cfg.wsUrl.replace(/^wss?:\/\//, location.protocol + '//').replace(/\/ws$/, '');
        }
        return `${location.protocol}//${location.host}`;
      }
      const authHeaders = () => ({
        'Content-Type': 'application/json',
        Authorization: `Bearer ${auth.token}`,
      });

      async function api(path, opts = {}) {
        const r = await fetch(apiBase() + path, { ...opts, headers: authHeaders() });
        if (r.status === 401) {
          localStorage.removeItem('ego_auth');
          location.replace('login.html');
          throw new Error('unauthorized');
        }
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || `erro ${r.status}`);
        return data;
      }

      // ---- Toast ----
      let toastT;
      function toast(msg, isErr) {
        const t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isErr ? ' err' : '');
        clearTimeout(toastT);
        toastT = setTimeout(() => (t.className = 'toast' + (isErr ? ' err' : '')), 2800);
      }

      // ---- Render ----
      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      }
      function fmtDate(iso) {
        if (!iso) return '—';
        try {
          return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: '2-digit' });
        } catch {
          return '—';
        }
      }
      let ROLES = ['admin', 'user', 'guest'];

      function roleSelect(u) {
        const opts = ROLES.map(
          (r) => `<option value="${r}"${r === u.role ? ' selected' : ''}>${r}</option>`,
        ).join('');
        const self = u.email === auth.email ? ' disabled title="não é possível mudar o próprio papel"' : '';
        return `<select class="role" data-id="${u.id}"${self}>${opts}</select>`;
      }

      function renderRows(users) {
        $('count').textContent = users.length + (users.length === 1 ? ' usuário' : ' usuários');
        if (!users.length) {
          $('tbody').innerHTML = '<tr><td colspan="5"><div class="state">Nenhum usuário ainda.</div></td></tr>';
          return;
        }
        $('tbody').innerHTML = users
          .map((u) => {
            const you = u.email === auth.email ? '<span class="you">(você)</span>' : '';
            const statusBadge = u.active
              ? '<span class="badge on"><span class="dotb"></span>ativo</span>'
              : '<span class="badge off"><span class="dotb"></span>inativo</span>';
            const isSelf = u.email === auth.email;
            const toggleLabel = u.active ? 'desativar' : 'ativar';
            const toggleBtn = isSelf
              ? ''
              : `<button class="btn btn-ghost btn-sm" data-act="toggle" data-id="${u.id}" data-active="${u.active ? 1 : 0}">${toggleLabel}</button>`;
            const delBtn = isSelf
              ? ''
              : `<button class="btn btn-danger btn-sm" data-act="del" data-id="${u.id}" data-email="${esc(u.email)}">excluir</button>`;
            return `<tr>
              <td class="email">${esc(u.email)} ${you}</td>
              <td>${roleSelect(u)}</td>
              <td>${statusBadge}</td>
              <td class="muted">${fmtDate(u.created_at)}</td>
              <td><div class="actions">${toggleBtn}${delBtn}</div></td>
            </tr>`;
          })
          .join('');
      }

      async function load() {
        try {
          const data = await api('/admin/users');
          if (Array.isArray(data.roles) && data.roles.length) ROLES = data.roles;
          renderRows(data.users || []);
        } catch (e) {
          if (e.message === 'unauthorized') return;
          $('tbody').innerHTML = `<tr><td colspan="5"><div class="state">Falha ao carregar: ${esc(e.message)}</div></td></tr>`;
        }
      }

      // ---- Actions ----
      $('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('newEmail').value.trim();
        const password = $('newPass').value;
        const role = $('newRole').value;
        if (!email || password.length < 6) {
          toast('Preencha e-mail e senha (mín. 6 caracteres).', true);
          return;
        }
        $('addBtn').disabled = true;
        try {
          await api('/admin/users', { method: 'POST', body: JSON.stringify({ email, password, role }) });
          $('newEmail').value = '';
          $('newPass').value = '';
          $('newRole').value = 'user';
          toast('Usuário adicionado.');
          load();
        } catch (e) {
          toast(e.message, true);
        } finally {
          $('addBtn').disabled = false;
        }
      });

      $('tbody').addEventListener('change', async (e) => {
        const sel = e.target.closest('select.role');
        if (!sel) return;
        const id = sel.dataset.id;
        try {
          await api('/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ role: sel.value }) });
          toast('Papel atualizado.');
          load();
        } catch (e) {
          toast(e.message, true);
          load();
        }
      });

      $('tbody').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.dataset.act === 'toggle') {
          const makeActive = btn.dataset.active === '0';
          try {
            await api('/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ active: makeActive }) });
            toast(makeActive ? 'Usuário ativado.' : 'Usuário desativado.');
            load();
          } catch (e) {
            toast(e.message, true);
          }
        } else if (btn.dataset.act === 'del') {
          if (!confirm(`Excluir ${btn.dataset.email}? Esta ação não pode ser desfeita.`)) return;
          try {
            await api('/admin/users/' + id, { method: 'DELETE' });
            toast('Usuário excluído.');
            load();
          } catch (e) {
            toast(e.message, true);
          }
        }
      });

      $('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('ego_auth');
        location.replace('login.html');
      });

      // init
      if (auth && auth.role === 'admin') {
        $('whoami').textContent = auth.email;
        load();
      }
    </script>
  </body>
</html>
