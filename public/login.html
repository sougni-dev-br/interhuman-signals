  <head>

    <title>ego signals — entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script src="v2/config.js?v=white1"></script>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #fafafa;
        --ink: #0a0a0a;
        --ink-2: #525252;
        --ink-3: #a3a3a3;
        --line: #e5e5e5;
        --line-2: #d4d4d4;
        --primary: #171717;
        --primary-h: #000000;
        --danger: #b42318;
        --danger-bg: #fef3f2;
        --radius: 8px;
        --radius-lg: 16px;
        --shadow: 0 1px 2px rgba(10, 10, 10, 0.04), 0 8px 24px rgba(10, 10, 10, 0.05);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      /* faint dotted grid, very subtle — keeps it from feeling flat */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(circle at 1px 1px, rgba(10, 10, 10, 0.035) 1px, transparent 0);
        background-size: 26px 26px;
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      }

      .wrap {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .stack {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: rise 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Brand */
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 30px;
      }
      .brand .logo {
        height: 22px;
        width: auto;
        color: var(--ink);
        display: block;
      }
      .brand .cube-badge { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:9px; background:#0a0a0a; }
      .brand .cube-badge img { width:26px; height:26px; display:block; }
      .brand .sep {
        width: 1px;
        height: 18px;
        background: var(--line-2);
      }
      .brand .product {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--ink-2);
      }

      /* Card */
      .card {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 30px 28px 26px;
      }
      .card h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 5px;
        color: var(--ink);
      }
      .card .sub {
        font-size: 13.5px;
        color: var(--ink-3);
        margin: 0 0 22px;
      }

      /* Alert */
      .alert {
        display: none;
        align-items: flex-start;
        gap: 8px;
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid #fecdca;
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .alert.show {
        display: flex;
        animation: shake 0.4s ease;
      }
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-1px);
        }
        30%,
        70% {
          transform: translateX(2px);
        }
        50% {
          transform: translateX(-2px);
        }
      }

      /* Fields */
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        font-family: inherit;
        font-size: 14.5px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--radius);
        padding: 10px 13px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .field input::placeholder {
        color: var(--ink-3);
      }
      .field input:focus {
        outline: none;
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.06);
      }

      /* Buttons */
      .btn {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        border-radius: var(--radius);
        padding: 11px 16px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.05s ease,
          opacity 0.15s ease;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        margin-top: 6px;
      }
      .btn-primary:hover {
        background: var(--primary-h);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn-ghost {
        background: var(--bg);
        color: var(--ink);
        border-color: var(--line-2);
      }
      .btn-ghost:hover {
        background: var(--panel);
      }
      .btn .spin {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      .btn.loading .spin {
        display: inline-block;
      }
      .btn.loading .label {
        opacity: 0.7;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: var(--ink-3);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      /* Footer */
      .foot {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--ink-3);
      }
      .foot a {
        color: var(--ink-2);
        text-decoration: none;
      }
      .foot a:hover {
        color: var(--ink);
      }
      .foot .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--line-2);
      }

      @media (max-width: 440px) {
        .card {
          padding: 26px 20px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="stack">
        <!-- Brand -->
        <div class="brand">
          <span class="cube-badge"><img src="sougni-cube.webp?v=cube1" width="26" height="26" alt="Sougni" decoding="async" /></span>
          <span class="sep"></span>
          <span class="product">ego signals</span>
        </div>

        <!-- Card -->
        <div class="card">
          <h1>Entrar</h1>
          <p class="sub">Acesse sua conta para continuar.</p>

          <div class="alert" id="alert" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
              <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16.5v.01" stroke-linecap="round" />
            </svg>
            <span id="alertText"></span>
          </div>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                inputmode="email"
                placeholder="voce@exemplo.com"
                required
              />
            </div>
            <div class="field">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span class="spin" aria-hidden="true"></span>
              <span class="label">Entrar</span>
            </button>
          </form>

          <div class="divider">ou</div>

          <button type="button" class="btn btn-ghost" id="guestBtn">
            <span class="spin" aria-hidden="true" style="border-color:rgba(10,10,10,.25);border-top-color:var(--ink)"></span>
            <span class="label">Continuar como visitante</span>
          </button>
        </div>

        <!-- Footer -->
        <div class="foot">
          <span>© 2026 Sougni</span>
          <span class="dot"></span>
          <a href="mailto:rafael@sougni.com?subject=ego%20signals">suporte</a>
        </div>
      </div>
    </div>

    <script>
      const cfg = window.IH_CONFIG || {};
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const guestBtn = document.getElementById('guestBtn');
      const alertEl = document.getElementById('alert');
      const alertText = document.getElementById('alertText');

      function showError(msg) {
        alertText.textContent = msg;
        alertEl.classList.add('show');
        alertEl.style.animation = 'none';
        void alertEl.offsetHeight;
        alertEl.style.animation = '';
      }
      function clearError() {
        alertEl.classList.remove('show');
      }

      function authEndpoint() {
        const isDevLocal =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (cfg.wsUrl && !isDevLocal) {
          return cfg.wsUrl
            .replace(/^wss?:\/\//, location.protocol + '//')
            .replace(/\/ws$/, '/auth');
        }
        return `${location.protocol}//${location.host}/auth`;
      }

      function persistAndGo(data) {
        sessionStorage.setItem(
          'ego_auth',
          JSON.stringify({
            token: data.token,
            email: data.email,
            exp: data.exp,
            role: data.role || 'user',
          }),
        );
        // admin vai pro painel; demais vão pro teste (versao busta cache de HTML)
        location.replace(data.role === 'admin' ? '/admin.html?v=pw1' : '/v2/?v=obs1');
      }

      // A entrada SEMPRE passa por esta tela — nunca pula direto pro /v2/, mesmo
      // com sessão válida. Sessão vive em sessionStorage (some ao fechar o navegador).
      // Limpa qualquer token antigo em localStorage (modelo migrou pra sessionStorage).
      try {
        localStorage.removeItem('ego_auth');
      } catch {}

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
          showError('Preencha e-mail e senha.');
          return;
        }
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        try {
          const r = await fetch(authEndpoint(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            if (r.status === 429) showError('Muitas tentativas. Aguarde alguns minutos.');
            else showError(data.error || 'E-mail ou senha inválidos.');
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            return;
          }
          persistAndGo(data);
        } catch (err) {
          showError('Falha na conexão: ' + err.message);
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
        }
      });

      guestBtn.addEventListener('click', async () => {
        clearError();
        guestBtn.classList.add('loading');
        guestBtn.disabled = true;
        try {
          const r = await fetch(authEndpoint(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guest: true }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            showError(data.error || `Não foi possível entrar como visitante (erro ${r.status}).`);
            guestBtn.classList.remove('loading');
            guestBtn.disabled = false;
            return;
          }
          sessionStorage.setItem(
            'ego_auth',
            JSON.stringify({ token: data.token, email: data.email, exp: data.exp, role: 'guest' }),
          );
          location.replace('/v2/?v=obs1');
        } catch (err) {
          showError('Falha na conexão: ' + err.message);
          guestBtn.classList.remove('loading');
          guestBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
