# Render Blueprint — https://render.com/docs/blueprint-spec
# Serviço real em produção: ego-backend (https://ego-backend-lerb.onrender.com)
# Segredos ficam com sync:false → setados à mão no dashboard, nunca versionados.
services:
  - type: web
    name: ego-backend
    runtime: node
    plan: starter                # sempre-ligado (sem cold-start) + habilita disco
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    # Disco persistente pro SQLite (libSQL) dos usuários/papéis. Aponte
    # TURSO_DATABASE_URL=file:/var/data/ego.db (env no dashboard) pra usá-lo.
    disk:
      name: ego-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # --- Secrets (setar no dashboard, sync:false) ---
      - key: INTERHUMAN_API_KEY   # chave do upstream Interhuman (WS)
        sync: false
      - key: TOKEN_SECRET         # assina os tokens HMAC de sessão — OBRIGATÓRIO
        sync: false
      - key: PASSCODE             # fallback WS legado (só servidor, rotacionado)
        sync: false
      - key: USERS                # "email1:senha1,email2:senha2" (login /auth)
        sync: false
      - key: ANTHROPIC_API_KEY    # perfilamento Claude; sem ela cai no rule-based
        sync: false
      - key: TURSO_DATABASE_URL   # banco de usuários/papéis (libsql://... do Turso)
        sync: false
      - key: TURSO_AUTH_TOKEN     # token do banco Turso
        sync: false
      - key: ADMIN_EMAIL          # seed do 1º admin (só na 1ª subida com banco vazio)
        sync: false
      - key: ADMIN_PASSWORD       # senha do 1º admin (troque depois pelo painel)
        sync: false
      # --- Config não-secreta ---
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        value: https://ego.sougni.com
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: NODE_VERSION
        value: "20"
